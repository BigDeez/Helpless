<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --obsidian: #050205;
            --blood: #5a0a0a;
            --bruise: #1a0a1d;
            --gold: #b48b3a;
            --ash: #a0a0a0;
        }

        body {
            background: radial-gradient(circle, #1a0505 0%, #000 100%);
            color: var(--gold);
            font-family: 'Pirata One', system-ui;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-y: auto; /* Allow scrolling if text is long */
            box-sizing: border-box;
        }

        /* Occult Background Elements */
        .sigil-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vh; height: 80vh;
            background: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
            border: 2px double var(--blood);
            animation: rotate 100s linear infinite;
        }

        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .header {
            margin-bottom: 25px;
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            font-family: 'UnifrakturMaguntia', serif;
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 3px;
            color: var(--blood);
            text-shadow: 0 0 15px rgba(90, 10, 10, 0.9);
        }

        .sub-head {
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: var(--ash);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Card Layout - Sized for mobile and desktop */
        .card-container {
            width: 300px;
            height: 380px;
            perspective: 1200px;
            margin-bottom: 30px;
            flex-shrink: 0;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border: 2px solid var(--blood);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 0 50px #000, 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .card-front {
            background: #0a0a0a;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        .card-back {
            background: #0f050f;
            transform: rotateY(180deg);
            border-color: var(--gold);
            font-size: 1.15rem;
            color: #ddd;
            line-height: 1.4;
        }

        /* The Ritual Altar - Organized Grid */
        .ritual-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 40px; /* Space at bottom */
        }

        button {
            background: #150505;
            border: 1px solid var(--blood);
            color: var(--gold);
            padding: 12px 5px;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            border-radius: 4px;
        }

        button:active {
            transform: scale(0.95);
            background: var(--blood);
            color: #fff;
        }

        .btn-full {
            grid-column: span 2;
            background: linear-gradient(45deg, #000, #400, #000);
            border: 1px solid var(--blood);
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
        }

        /* Overlay Fix */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        #overlay h2 {
            color: var(--blood);
            font-family: 'UnifrakturMaguntia';
            font-size: 2.5rem;
            margin: 0;
        }

        .ritual-text-content {
            font-family: 'Pirata One', serif;
            color: var(--ash);
            border-top: 1px solid var(--blood);
            padding-top: 15px;
        }
    </style>
</head>
