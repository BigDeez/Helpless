<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE BLACK ALTAR | BLOOD & BINDING</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Pirata+One&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #050205;
            --blood: #4a0404;
            --bruise: #2d1b33;
            --gold: #c5a059;
            --ash: #888;
        }

        body {
            background: linear-gradient(to bottom, #0a050a, #000000);
            color: var(--gold);
            font-family: 'Pirata One', system-ui;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            text-shadow: 0 0 10px rgba(0,0,0,1);
        }

        /* Occult Background Elements */
        .sigil-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vh; height: 90vh;
            background: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.1;
            z-index: -1;
            border-radius: 50%;
            border: 1px double var(--blood);
            animation: rotate 60s linear infinite;
        }

        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .header {
            margin: 30px 0;
            text-align: center;
            border-bottom: 2px solid var(--blood);
        }

        h1 {
            font-family: 'UnifrakturMaguntia', serif;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: 5px;
            color: var(--blood);
            text-shadow: 0 0 20px rgba(74, 4, 4, 0.8);
        }

        .card-container {
            width: 320px;
            height: 460px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border: 3px solid var(--blood);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        .card-front {
            background: var(--obsidian);
            background-image: url('https://www.transparenttextures.com/patterns/black-paper.png');
        }

        .card-back {
            background: #110811;
            transform: rotateY(180deg);
            border-color: var(--gold);
            font-size: 1.2rem;
            color: var(--ash);
            letter-spacing: 1px;
        }

        .ritual-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 90%;
            max-width: 400px;
        }

        button {
            background: #1a0505;
            border: 1px solid var(--blood);
            color: var(--ash);
            padding: 15px 5px;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--blood);
            color: white;
            box-shadow: 0 0 15px var(--blood);
        }

        .btn-extreme {
            grid-column: span 2;
            background: linear-gradient(to right, #000, #4a0404, #000);
            border: 1px solid var(--gold);
            font-weight: bold;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="sigil-bg"></div>
    
    <div class="header">
        <h1>MALLEUS MALEFICARUM</h1>
        <div style="font-size: 0.8rem; letter-spacing: 4px;">OWNERSHIP THROUGH AGONY</div>
    </div>

    <div class="card-container" onclick="this.querySelector('.card').classList.toggle('flipped')">
        <div class="card" id="mainCard">
            <div class="card-face card-front">
                <div style="font-size: 5rem; color: var(--blood); opacity: 0.5;">⛧</div>
                <p style="color: var(--gold)">SURRENDER YOUR WILL</p>
            </div>
            <div class="card-face card-back" id="ritualText">
                Select your sentence...
            </div>
        </div>
    </div>

    <div class="ritual-grid">
        <button onclick="invoke('penance')">Penance</button>
        <button onclick="invoke('tithe')">Witch's Tithe</button>
        <button onclick="invoke('humiliation')">Degradation</button>
        <button onclick="invoke('binding')">The Binding</button>
        <button onclick="invoke('abyss')" class="btn-extreme">THE ABYSS (EXTREME)</button>
        <button onclick="invoke('ruin')" class="btn-extreme">THE RUIN (ENDING)</button>
    </div>

    <div id="overlay">
        <h2 style="color: var(--blood); font-family: 'UnifrakturMaguntia'; font-size: 3rem;">ABANDON HOPE</h2>
        <p>This path leads to total breaking. Do you accept the marks?</p>
        <button onclick="confirmAbyss()" style="width: 200px; margin-bottom: 10px;">I AM HERS</button>
        <button onclick="closeOverlay()" style="width: 200px; border-color: var(--ash);">RETREAT</button>
    </div>

    <script>
        const Grimoire = {
            penance: [
                "THE KNEELING STATUE: Place a heavy book on your head and heavy weights on your package. If the book falls, she delivers a violent strike.",
                "THE SHARP TRACE: She traces the veins of your groin with a needle or sharp blade. You must thank her for every scratch without flinching.",
                "THE COLD ISOLATION: Submerge the package in ice water for 3 minutes. When they are shrunken, she uses pliers or clamps to 'find' them again."
            ],
            tithe: [
                "THE PEDESTAL: You are a piece of furniture. She rests her weight on your groin while she reads or uses her phone. You are not allowed to groan.",
                "THE SACRIFICIAL LAPPING: Clean her boots with your tongue while your package is tightly cinched with wire or cord behind your legs.",
                "THE MARKED SLAVE: She carves her initials into your skin with a marker—or a dull blade—to remind you who owns the flesh she toys with."
            ],
            humiliation: [
                "THE KITCHEN SCRAP: Kneel naked. She treats your package like waste, flicking them, laughing at your discomfort, and calling you 'it'.",
                "THE VERBAL ASHES: While she applies painful pressure, recite 5 reasons why you are unworthy of a woman's touch.",
                "THE EXHIBITION: Record a video of your package in heavy clamps, stating your name and your status as her broken property."
            ],
            binding: [
                "THE SPIDER'S WEB: Use thin thread to wrap the package dozens of times until it is a purple, constricted mess. Leave it for 10 minutes.",
                "THE IRON GALLOWS: Hang weights from the sac. You must walk across the room. Every swing that causes pain is a gift to her.",
                "THE FIGURE EIGHT: Tight cord wrapped between the base and the balls, pulled so tight you cannot stand up straight."
            ],
            abyss: [
                "THE BALL-STRETCHER RACK: Maximum weight applied. You are stood on a chair; she kicks the chair away. Your weight is the torture.",
                "THE NEEDLE RITUAL: (SIMULATED/SAFE) She uses ice and sharp pressure to convince you she is piercing you. Total psychological breaking.",
                "THE HEEL GRIND: She wears her sharpest heels and places the stiletto point directly on the sac, applying pressure until you sob."
            ],
            ruin: [
                "THE RUINED OFFERING: Bring yourself to the absolute edge. At the peak, she delivers a crushing blow or a freezing shock. No release. Ever.",
                "THE CONSUMPTION: If she allows a release, it must be into a bowl. You will then clean the bowl with your tongue until it shines.",
                "THE PERMANENT CLAMP: The ritual ends, but the clamps stay on. You go to sleep in pain, knowing she has the key."
            ]
        };

        function invoke(type) {
            if (type === 'abyss') {
                document.getElementById('overlay').style.display = 'flex';
                return;
            }
            draw(type);
        }

        function confirmAbyss() {
            closeOverlay();
            draw('abyss');
        }

        function closeOverlay() {
            document.getElementById('overlay').style.display = 'none';
        }

        function draw(type) {
            const list = Grimoire[type];
            const text = list[Math.floor(Math.random() * list.length)];
            const card = document.getElementById('mainCard');
            
            card.classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('ritualText').innerHTML = `<strong>${type.toUpperCase()}</strong><br><br>${text}`;
                card.classList.add('flipped');
            }, 400);
        }
    </script>
</body>
</html>
