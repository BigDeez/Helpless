<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Shadow Grimoire | Veil of Whispers</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+English+SC&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        :root {
            --gold: #e4c580;
            --blood: #8b2a2a;
            --void: #03000a;
            --parchment: #f2e9d0;
            --ember: #ff7e4a;
            --standard-glow: #6a4e2e;
            --tithe-royal: #7a3e6e;
            --abyss-dark: #3c1e2f;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #2c1420 0%, var(--void) 100%);
            color: var(--gold);
            font-family: 'IM Fell English SC', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            perspective: 1200px;
            position: relative;
        }

        .living-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.4;
            animation: floatHeart linear infinite;
            filter: drop-shadow(0 0 3px rgba(228,197,128,0.3));
            pointer-events: none;
        }

        @keyframes floatHeart {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-20vh) scale(1.2) rotate(15deg); opacity: 0; }
        }

        .firework-spark {
            position: absolute;
            width: 4px; height: 4px;
            background: radial-gradient(circle, #ffb347, #ff4d4d);
            border-radius: 50%;
            opacity: 0;
            animation: burstSpark 1.2s ease-out forwards;
            pointer-events: none;
            box-shadow: 0 0 6px gold;
        }

        @keyframes burstSpark {
            0% { opacity: 0; transform: scale(0.2) translateY(0); }
            20% { opacity: 0.9; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(0.5) translateY(-40px); }
        }

        .glitter-mote {
            position: absolute;
            width: 2px; height: 2px;
            background: #ffd966;
            border-radius: 50%;
            opacity: 0;
            animation: driftGlitter 8s infinite linear;
            pointer-events: none;
            box-shadow: 0 0 4px #f3b33d;
        }

        @keyframes driftGlitter {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
            30% { opacity: 0.8; }
            100% { transform: translate(40px, -60px) rotate(90deg); opacity: 0; }
        }

        .veil {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(2px 2px at 20% 30%, var(--gold) 1px, transparent 1px),
                              radial-gradient(1px 1px at 70% 85%, #b96f30 1px, transparent 1px);
            background-size: 70px 70px, 40px 40px;
            opacity: 0.18;
            animation: driftRunes 35s linear infinite;
        }

        .grimoire-header {
            text-align: center;
            z-index: 15;
            margin: 10px 0;
            position: relative;
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.45rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #efd592 10%, #b48b3a 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(228, 197, 128, 0.4);
            margin: 0;
        }

        .sub {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #b48b5a;
            text-transform: uppercase;
            border-top: 1px solid rgba(228, 197, 128, 0.3);
            display: inline-block;
            padding-top: 4px;
        }

        .card-holder {
            position: relative;
            width: 290px;
            height: 400px;
            z-index: 20;
            margin: 15px 0;
            filter: drop-shadow(0 15px 45px rgba(0,0,0,0.9));
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 25px;
            border: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.95);
        }

        .card-front { background: #0f0712 url('https://www.transparenttextures.com/patterns/hexellence.png'); }

        .card-back {
            background: linear-gradient(145deg, #1a0b1c 0%, #050308 100%);
            transform: rotateY(180deg);
            color: var(--parchment);
            font-family: 'MedievalSharp', serif;
            font-size: 1rem;
            line-height: 1.5;
            border: 2px solid #634d2a;
        }

        .ritual-altar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 350px;
            z-index: 25;
            margin-top: 10px;
        }

        button {
            background: rgba(15, 8, 20, 0.9);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 5px;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.75rem;
            border-radius: 10px;
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-standard { background: radial-gradient(circle at 30% 20%, #8b5a2b, #4a3620); }
        .btn-tithe { background: radial-gradient(circle at 70% 30%, #6a2e6e, #35203b); }
        .btn-abyss { background: radial-gradient(circle at 40% 50%, #2c1a2a, #150810); border-color: var(--blood); }
        .btn-wide { grid-column: span 3; background: rgba(35, 15, 30, 0.8); }

        .pact-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.97);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .pact-card {
            background: #120b17;
            border: 2px solid var(--gold);
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
        }
    </style>
</head>
<body>
    <div class="living-background" id="livingBg"></div>
    <div class="veil"></div>

    <div class="grimoire-header">
        <h1>🜏 THE SHADOW GRIMOIRE 🜏</h1>
        <div class="sub">✧ Rites of the Unspoken ✧</div>
    </div>

    <div class="card-holder" id="cardContainer">
        <div class="card" id="ritualCard">
            <div class="card-face card-front">
                <div style="font-size: 4rem; color: var(--gold);">◈</div>
                <p>TOUCH THE VEIL</p>
            </div>
            <div class="card-face card-back" id="oracleText">
                <div class="ritual-text">Speak the command...</div>
            </div>
        </div>
    </div>

    <div class="ritual-altar">
        <button onclick="handleRitual('standard')" class="btn-standard">Standard</button>
        <button onclick="handleRitual('tithe')" class="btn-tithe">Queen's Tithe</button>
        <button onclick="handleRitual('abyss')" class="btn-abyss">The Abyss</button>
        <button onclick="handleRitual('finish')" class="btn-wide">⚔️ Final Judgment</button>
        <button onclick="handleRitual('disposal')" class="btn-wide">🍷 The Disposal</button>
        <button onclick="handleRitual('sanctuary')" class="btn-wide">🕯️ Afterglow</button>
    </div>

    <div id="pactOverlay" class="pact-overlay">
        <div class="pact-card">
            <h2>Invoke the Rite?</h2>
            <div style="display: flex; gap: 15px;">
                <button onclick="confirmPact(true)" style="flex: 1;">Seal Pact</button>
                <button onclick="confirmPact(false)" style="flex: 1;">Retreat</button>
            </div>
        </div>
    </div>

    <script>
        const RitualDecks = {
            standard: [
                "THE GRAVITY WELL: Secure weights to the sac. Stand perfectly still for 3 minutes. Any movement earns a squeeze.",
                "THE CROW'S PINCH: Use sharp nails to find the skin between, pulling and pinching while I am restricted.",
                "THE WICKED TWIST: Rotate the sac a full half-turn. Hold it while you tell me exactly what I am.",
                "THE CRUSHING DEPTHS: Place the sac between your palms and slowly lean your weight into them.",
                "THE BLOOD COIL: Tie thin lace or string around the base, cinching it tight while you toy with the tops.",
                "THE COLD DECREE: Apply ice until they are shrunken and tight, then use your warm mouth to bring heat back.",
                "THE MISTRESS'S CHOICE: You decide the tool and the tension. No limit for 60 seconds.",
                "THE SILENT TRIAL: No words for 2 minutes. Every attempt to speak earns sudden, sharp pressure.",
                "THE SORROW'S HINGE: Fold the sac gently but firmly. Rock it side to side while reciting my submission.",
                "THE GILDED KNOT: Tie a silk cord around the package, tightening one notch each time I gasp.",
                "THE RITUAL OF TWO PALMS: Cup them and slap upwards from below with rhythmic force, counting to thirteen.",
                "THE MERCY THRESHOLD: Edge me with a flogger until I beg, then delay the strike for six heartbeats."
            ],
            abyss: [
                "THE IRON GALLOWS: Weights attached. Stand on tiptoes. Every time heels touch the floor, deliver a brutal squeeze.",
                "THE SILENT ANCHOR: Heavy clamp applied. Ignored for 10 minutes while kneeling. Any sound resets the timer.",
                "THE WEAVER’S NEEDLE: Pin-tool tracing the seams. Agonizingly light pressure followed by a violent pinch.",
                "THE GRAVITY CRUSH: Lay flat. Use your full weight to step on the sac, increasing pressure until I beg.",
                "STRETCHED ON THE RACK: Pull the sac toward the floor while I am bound upright, ensuring skin is taut and vulnerable.",
                "THE INCUBUS WEIGHT: I lie flat; you straddle my hips. Shift your weight slowly onto the dangling flesh."
            ],
            tithe: [
                "THE HUMAN FOOTREST: Legs spread and sac weighted. Support her feet while she rests. Wobbling earns a heel grind.",
                "THE ROYAL CLEANSE: Use your tongue to clean her shoes/feet while the sac is stretched back between your legs.",
                "THE BREATH COLLECTOR: No air allowed until she finishes a task. Your discomfort is her background music.",
                "THE MARKET PRICE: She labels you with a marker—writing 'TRASH' across the skin while it is stretched taut."
            ],
            finish: [
                "THE RUINED OFFERING: Edge to the absolute brink—then a crushing squeeze and a cold ice cube. No release.",
                "THE BROKEN PRAYER: Release granted only while being painfully twisted. Thank her for the pain while you climax.",
                "THE DEBT COLLECTOR: If he releases early, spend the next hour in heavy clamps while being ignored."
            ],
            disposal: [
                "FOR HER: THE CLAY MASK. Applied to her face and lips. She wears it as a silent, cherished statue.",
                "FOR HER: THE GILDED COLLAR. Poured over her neck and chest. A permanent mark of the night’s love.",
                "FOR HIM: THE BITTER SWALLOW. She takes it all while maintaining eye contact. Total consumption and surrender.",
                "FOR HIM: THE RECLAMATION. She gathers the offering from her skin and feeds it back to you. Shared intimacy.",
                "FOR BOTH: THE PRESS. Bodies crushed together until you are both coated and bound by the mess.",
                "FOR BOTH: THE SILK WIPE. She uses her hair or her clothes to clean you, marking them with the offering."
            ],
            sanctuary: [
                "THE HEALER’S HANDS: Release all bindings. Cradle in warm palms with soft, loving strokes.",
                "THE ANOINTING: Massage with warm oil. 'You did so well for me.'",
                "THE BREATH OF LIFE: Head on chest; breathe in unison for 60 seconds of peace.",
                "THE COVEN’S REST: No more commands. Just water and a soft touch on the cheek."
            ]
        };

        let lastCategory = '';
        let pendingCategory = '';
        const card = document.getElementById('ritualCard');
        const oracle = document.getElementById('oracleText');

        function createHeart() {
            const heartDiv = document.createElement('div');
            heartDiv.classList.add('heart');
            const hearts = ['❤️', '💖', '💜', '💗', '💘', '💕', '💚', '💞','🌶','😍','🥰','💙','😈','💋','❤️‍🔥','💥','💦','💣'];
            heartDiv.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
            heartDiv.style.left = Math.random() * 100 + '%';
            heartDiv.style.animationDuration = (5 + Math.random() * 5) + 's';
            document.getElementById('livingBg').appendChild(heartDiv);
            setTimeout(() => heartDiv.remove(), 10000);
        }

        setInterval(createHeart, 1000);

        function handleRitual(category) {
            if (category !== 'standard' && category !== 'sanctuary' && category !== lastCategory) {
                pendingCategory = category;
                document.getElementById('pactOverlay').style.display = 'flex';
            } else {
                drawRitual(category);
            }
        }

        function confirmPact(accepted) {
            document.getElementById('pactOverlay').style.display = 'none';
            if (accepted) {
                lastCategory = pendingCategory;
                drawRitual(pendingCategory);
            }
        }

        function drawRitual(category) {
            const deck = RitualDecks[category];
            const ritual = deck[Math.floor(Math.random() * deck.length)];
            card.classList.remove('flipped');
            setTimeout(() => {
                oracle.innerHTML = `<div class="ritual-text">${ritual}</div>`;
                card.classList.add('flipped');
            }, 300);
        }

        function veto() {
            card.classList.remove('flipped');
        }
    </script>
</body>
</html>
