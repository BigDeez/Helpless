<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE BLACK ALTAR | BLOOD & BINDING</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Pirata+One&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #050205;
            --blood: #5a0a0a;
            --bruise: #1a0a1d;
            --gold: #b48b3a;
            --ash: #a0a0a0;
        }

        body {
            background: radial-gradient(circle, #1a0505 0%, #000 100%);
            color: var(--gold);
            font-family: 'Pirata One', system-ui;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-y: auto; /* Allow scrolling if text is long */
            box-sizing: border-box;
        }

        /* Occult Background Elements */
        .sigil-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vh; height: 80vh;
            background: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
            border: 2px double var(--blood);
            animation: rotate 100s linear infinite;
        }

        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .header {
            margin-bottom: 25px;
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            font-family: 'UnifrakturMaguntia', serif;
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 3px;
            color: var(--blood);
            text-shadow: 0 0 15px rgba(90, 10, 10, 0.9);
        }

        .sub-head {
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: var(--ash);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Card Layout - Sized for mobile and desktop */
        .card-container {
            width: 300px;
            height: 380px;
            perspective: 1200px;
            margin-bottom: 30px;
            flex-shrink: 0;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border: 2px solid var(--blood);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 0 50px #000, 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .card-front {
            background: #0a0a0a;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }

        .card-back {
            background: #0f050f;
            transform: rotateY(180deg);
            border-color: var(--gold);
            font-size: 1.15rem;
            color: #ddd;
            line-height: 1.4;
        }

        /* The Ritual Altar - Organized Grid */
        .ritual-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 40px; /* Space at bottom */
        }

        button {
            background: #150505;
            border: 1px solid var(--blood);
            color: var(--gold);
            padding: 12px 5px;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            border-radius: 4px;
        }

        button:active {
            transform: scale(0.95);
            background: var(--blood);
            color: #fff;
        }

        .btn-full {
            grid-column: span 2;
            background: linear-gradient(45deg, #000, #400, #000);
            border: 1px solid var(--blood);
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
        }

        /* Overlay Fix */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        #overlay h2 {
            color: var(--blood);
            font-family: 'UnifrakturMaguntia';
            font-size: 2.5rem;
            margin: 0;
        }

        .ritual-text-content {
            font-family: 'Pirata One', serif;
            color: var(--ash);
            border-top: 1px solid var(--blood);
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="sigil-bg"></div>
    
    <div class="header">
        <h1>MALLEUS MALEFICARUM</h1>
        <div class="sub-head">DEVOTION THROUGH DEGRADATION</div>
    </div>

    <div class="card-container">
        <div class="card" id="mainCard" onclick="this.classList.toggle('flipped')">
            <div class="card-face card-front">
                <div style="font-size: 4rem; color: var(--blood); margin-bottom: 10px;">🜏</div>
                <p style="color: var(--gold); letter-spacing: 2px;">TOUCH TO REVEAL YOUR FATE</p>
            </div>
            <div class="card-face card-back" id="ritualText">
                <div class="ritual-text-content">The Mistress is waiting for your choice...</div>
            </div>
        </div>
    </div>

    <div class="ritual-grid">
        <button onclick="invoke('penance')">Penance</button>
        <button onclick="invoke('tithe')">The Tithe</button>
        <button onclick="invoke('shame')">Shame</button>
        <button onclick="invoke('binding')">Binding</button>
        <button onclick="invoke('abyss')" class="btn-full">ENTER THE ABYSS</button>
        <button onclick="invoke('ruin')" class="btn-full">THE FINAL RUIN</button>
    </div>

    <div id="overlay">
        <h2>NO ESCAPE</h2>
        <p style="color: var(--ash); max-width: 250px;">The Abyss does not tolerate hesitation. Do you submit to the extreme?</p>
        <button onclick="confirmAbyss()" style="width: 220px; margin-bottom: 15px; border-color: var(--gold);">I AM PROPERTY</button>
        <button onclick="closeOverlay()" style="width: 220px; background: transparent; border-color: #333;">RETREAT IN SHAME</button>
    </div>

    <script>
        const Grimoire = {
            penance: [
                "THE KNEELING STATUE: Balance a glass of water on your head while your package is weighted. If a drop spills, she delivers a sharp squeeze.",
                "THE SHARP TRACE: She traces your sensitive areas with a cold, sharp needle. You must thank her for the 'gift' of her attention.",
                "THE COLD DECREE: Apply ice until they are shrunken and purple. She then uses rough leather to 'warm' them with friction."
            ],
            tithe: [
                "THE ROYAL FOOTREST: Lie flat. She rests her weight on your groin while you describe how much better she is than you.",
                "THE BOOT CLEANSE: Use your tongue to clean her footwear. Your package must be bound tightly behind you with cord.",
                "THE LABELING: She writes 'TOY' or 'USELESS' on the skin of your sac while it is stretched to its limit."
            ],
            shame: [
                "THE VERBAL ASHES: Recite your most pathetic secret while she applies painful pressure. Your pain is her amusement.",
                "THE MIRROR TRIAL: Look at yourself in a mirror while she laughs at your package. Repeat: 'This belongs to her, not me.'",
                "THE BEGGING: You are not allowed to speak except to beg for more pain. Every silence is met with a sharp flick."
            ],
            binding: [
                "THE WEAVER’S TRAP: Wrap the package in tight thread or wire until blood flow is restricted. Hold for 5 minutes.",
                "THE IRON GALLOWS: Hang heavy weights from the sac and stand on tiptoes. If your heels touch, the penalty is a strike.",
                "THE FIGURE EIGHT: Cinch the base and the balls separately, pulling them in opposite directions until you sob."
            ],
            abyss: [
                "THE STAGE FOUR: Maximum weights. No support. She ignores you for 15 minutes while you hang in agony.",
                "THE STILETTO POINT: She places the tip of her heel on the center of the sac and slowly leans her weight in.",
                "THE TOTAL BREAK: Bind yourself until you cannot move. She toys with you until you lose your mind, then walks away."
            ],
            ruin: [
                "THE RUINED OFFERING: Bring yourself to the very brink. At the peak, she crushes them or uses ice. No release is permitted.",
                "THE RECLAMATION: If release is granted, it must be licked off her boots or the floor. Leave nothing behind.",
                "THE LOCKING: The ritual ends with a permanent clamp or cage. She keeps the key. You keep the ache."
            ]
        };

        function invoke(type) {
            if (type === 'abyss') {
                document.getElementById('overlay').style.display = 'flex';
                return;
            }
            draw(type);
        }

        function confirmAbyss() {
            closeOverlay();
            draw('abyss');
        }

        function closeOverlay() {
            document.getElementById('overlay').style.display = 'none';
        }

        function draw(type) {
            const list = Grimoire[type];
            const text = list[Math.floor(Math.random() * list.length)];
            const card = document.getElementById('mainCard');
            const ritualContainer = document.getElementById('ritualText');
            
            card.classList.remove('flipped');
            setTimeout(() => {
                ritualContainer.innerHTML = `<div class="ritual-text-content"><b style="color:var(--blood)">${type.toUpperCase()}</b><br><br>${text}</div>`;
                card.classList.add('flipped');
            }, 400);
        }
    </script>
</body>
</html>
